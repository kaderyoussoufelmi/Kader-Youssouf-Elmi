<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kader Youssouf Elmi — Informaticien</title>
  <meta name="description" content="Portfolio de Kader Youssouf Elmi, diplômé en Informatique de l'Université de Djibouti." />

  <style>
    /* =====================================================
       STYLES
       ===================================================== */
    :root {
      color-scheme: dark;
      --bg: #090c12;
      --bg-alt: #0f141d;
      --surface: #141b26;
      --text: #f4f6fb;
      --muted: #98a5b7;
      --line: rgba(165, 181, 202, .17);
      --accent: #00d9a3;
      --accent-ink: #06120f;
      --serif: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      --mono: ui-monospace, "SF Mono", Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; scroll-padding-top: 94px; }

    body {
      font-family: var(--sans);
      font-size: 17px;
      line-height: 1.65;
      background: radial-gradient(ellipse at 50% 0, rgba(55, 73, 143, .16), transparent 42rem), var(--bg);
      color: var(--text);
      transition: background .25s, color .25s;
    }

    a { color: inherit; }
    ul { list-style: none; }
    img { display: block; max-width: 100%; }

    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

    /* ---------- En-tête ---------- */
    .top {
      position: fixed; top: 14px; left: 0; right: 0; z-index: 20;
      padding: 0 16px;
    }
    .top .wrap {
      display: flex; align-items: center; justify-content: space-between;
      min-height: 62px; gap: 16px; max-width: 1060px;
      border: 1px solid var(--line); border-radius: 999px;
      background: var(--bg); backdrop-filter: blur(18px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, .2);
    }
    .brand { font-size: 1.1rem; font-weight: 750; text-decoration: none; white-space: nowrap; }
    .brand::after { content: "."; color: var(--accent); }

    .menu { display: flex; gap: 4px; }
    .menu a {
      text-decoration: none; color: var(--muted);
      font-size: .9rem; padding: 8px 13px; border-radius: 999px;
      transition: background .2s, color .2s;
    }
    .menu a:hover, .menu a.active { color: var(--text); background: rgba(255, 255, 255, .07); }

    .tools { display: flex; align-items: center; gap: 8px; }
    .pill {
      font: inherit; font-size: .85rem;
      background: rgba(255, 255, 255, .04); color: var(--text);
      border: 1px solid var(--line); border-radius: 999px;
      padding: 6px 11px; cursor: pointer;
    }
    .pill:hover { border-color: var(--accent); }
    .header-cv { display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 9px 17px; border: 1px solid #fff; border-radius: 999px; background: #fff; color: #090c12; font-size: .9rem; font-weight: 700; text-decoration: none; transition: transform .2s, background .2s; }
    .header-cv:hover { transform: translateY(-1px); background: #e8ebf2; }
    .header-cv svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: rgba(255, 255, 255, .04); }
    .lang button {
      font: inherit; font-size: .85rem; font-weight: 600;
      background: transparent; color: var(--muted);
      border: 0; border-radius: 999px; padding: 6px 11px; cursor: pointer;
    }
    .lang button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
    .burger { display: none; }

    /* ---------- Accueil ---------- */
    .hero { position: relative; overflow: hidden; min-height: 94vh; display: flex; flex-direction: column; justify-content: center; padding: 132px 0 54px; }
    .hero::before { content: ""; position: absolute; width: 420px; height: 420px; right: 6vw; top: 18%; border-radius: 50%; background: radial-gradient(circle, rgba(0, 217, 163, .1), rgba(79, 91, 255, .08) 42%, transparent 72%); filter: blur(8px); pointer-events: none; }
    .hero .wrap {
      position: relative; display: grid; grid-template-columns: 1fr 300px; gap: 56px; align-items: center;
    }
    .kicker {
      display: inline-flex; font-family: var(--mono); font-size: .78rem; letter-spacing: .04em;
      color: var(--accent); margin-bottom: 18px; padding: 6px 12px;
      border: 1px solid rgba(0, 217, 163, .25); border-radius: 999px; background: rgba(0, 217, 163, .06);
    }
    h1 {
      font-family: var(--serif); font-weight: 700;
      font-size: clamp(2.8rem, 7vw, 5rem); line-height: 1.02; letter-spacing: -.055em;
    }
    .role { margin-top: 16px; font-size: clamp(1.15rem, 2.2vw, 1.45rem); color: var(--accent); font-weight: 600; }
    .lead { margin-top: 20px; max-width: 600px; color: var(--muted); }

    .actions { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 12px; }
    .btn {
      display: inline-block; font: inherit; font-weight: 600; font-size: .95rem;
      padding: 11px 22px; border-radius: 999px; text-decoration: none; cursor: pointer;
      border: 1px solid var(--line); color: var(--text); background: rgba(255, 255, 255, .03);
      transition: transform .2s, border-color .2s, background .2s;
    }
    .btn:hover { transform: translateY(-2px); border-color: var(--accent); }
    .btn.solid { background: var(--text); border-color: var(--text); color: var(--bg); }
    .btn.solid:hover { filter: brightness(1.08); background: var(--text); }
    .hero .btn.solid { background: #4f5bff; border-color: #4f5bff; color: #fff; box-shadow: 0 12px 32px rgba(79, 91, 255, .28); }
    .hero .btn.solid:hover { background: #4f5bff; }

    .portrait {
      position: relative; aspect-ratio: 4 / 5; width: 100%;
      border: 1px solid var(--line); border-radius: 28px; background: var(--surface); overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .28);
    }
    .portrait img { width: 100%; height: 100%; object-fit: cover; }
    .portrait-floaters { position: absolute; inset: 0; pointer-events: none; }
    .portrait-floater {
      position: absolute; padding: 7px 12px; border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 999px; background: rgba(9, 12, 18, .72); color: #f4f6fb;
      font-family: var(--mono); font-size: .72rem; font-weight: 700; letter-spacing: .06em;
      backdrop-filter: blur(10px); box-shadow: 0 8px 24px rgba(0, 0, 0, .22);
      animation: gentle-float 4.5s ease-in-out infinite;
    }
    .portrait-floater::before { content: ""; display: inline-block; width: 6px; height: 6px; margin: 0 7px 1px 0; border-radius: 50%; background: var(--accent); }
    .portrait-floater.web { top: 14%; left: 7%; }
    .portrait-floater.ai { top: 46%; right: 7%; animation-delay: -1.5s; }
    .portrait-floater.data { bottom: 13%; left: 10%; animation-delay: -3s; }
    @keyframes gentle-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .portrait.missing img { display: none; }
    .portrait.missing::after {
      content: "KY"; position: absolute; inset: 0; display: grid; place-items: center;
      font-size: 4rem; font-weight: 800; color: var(--muted);
    }

    .facts { position: relative; margin-top: 54px; }
    .facts .wrap { padding: 0; }
    .facts dl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .facts dl > div { padding: 16px 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
    .facts dt { font-family: var(--mono); font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .facts dd { margin-top: 5px; font-weight: 600; font-size: .94rem; }

    /* ---------- Sections ---------- */
    section.block { padding: 88px 0; border-top: 1px solid var(--line); scroll-margin-top: 90px; background: var(--bg); color: var(--text); }
    section.alt {
      --bg: #ffffff;
      --bg-alt: #f3f6fa;
      --surface: #f8fafc;
      --text: #17212d;
      --muted: #566476;
      --line: rgba(31, 55, 78, .15);
      --accent: #4f5bff;
      --accent-ink: #ffffff;
      color: var(--text);
      background: #ffffff;
    }

    .head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 38px; }
    .num { font-family: var(--mono); font-size: .78rem; color: var(--accent); padding: 5px 9px; border: 1px solid rgba(0, 217, 163, .24); border-radius: 999px; }
    h2 { font-size: clamp(1.8rem, 4vw, 2.6rem); line-height: 1.15; letter-spacing: -.035em; }

    .two { display: grid; grid-template-columns: 1.4fr 1fr; gap: 56px; }
    .two p + p { margin-top: 16px; }
    .two p { color: var(--muted); }

    .side h3, .col h3 {
      font-family: var(--mono); font-size: .75rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .08em; color: var(--accent);
      margin-bottom: 12px;
    }
    .side { padding: 22px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); }
    .side li { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: .95rem; }
    .side li:first-child { border-top: 1px solid var(--line); }

    /* ---------- Projets ---------- */
    .project {
      display: grid; grid-template-columns: 1.15fr 1fr; gap: 40px; align-items: center;
      padding: 22px; margin: 22px 0; border: 1px solid var(--line); border-radius: 24px;
      background: var(--surface); box-shadow: 0 18px 50px rgba(0, 0, 0, .12);
    }
    .project:nth-of-type(even) .shot { order: 2; }

    .shot {
      position: relative; aspect-ratio: 16 / 10; width: 100%;
      border: 1px solid var(--line); border-radius: 16px; background: var(--bg); overflow: hidden;
    }
    .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
    .shot.missing img { display: none; }
    .shot.missing::after {
      content: attr(data-path); position: absolute; inset: 10px;
      display: grid; place-items: center; text-align: center;
      border: 1px dashed var(--line); border-radius: 12px;
      font-family: var(--mono); font-size: .8rem; color: var(--muted); padding: 10px;
    }

    .project .meta { font-family: var(--mono); font-size: .78rem; color: var(--accent); margin-bottom: 8px; }
    .project h3 { font-size: 1.5rem; line-height: 1.25; letter-spacing: -.025em; margin-bottom: 10px; }
    .project p { color: var(--muted); }
    .chips { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
    .chips span {
      font-size: .8rem; padding: 3px 10px; border: 1px solid var(--line);
      border-radius: 999px; color: var(--muted); background: rgba(255, 255, 255, .025);
    }
    .project a.more {
      display: inline-block; margin-top: 18px; font-weight: 600; font-size: .95rem;
      color: var(--accent); text-underline-offset: 4px;
    }

    /* ---------- Services ---------- */
    .services { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .service { padding: 22px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
    .service h3 { font-size: 1.15rem; margin-bottom: 8px; }
    .service p { color: var(--muted); font-size: .95rem; }
    .open {
      margin-top: 24px; padding: 18px 20px;
      border: 1px solid rgba(0, 217, 163, .22); border-radius: 16px;
      background: rgba(0, 217, 163, .045); font-size: 1.05rem;
    }
    @media (max-width: 860px) { .services { grid-template-columns: 1fr; } }

    /* ---------- Compétences ---------- */
    .skills { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 42px 64px; }
    .col { min-width: 0; }
    .col h3 { color: #7882ff; margin-bottom: 16px; }
    .col ul { display: flex; flex-wrap: wrap; gap: 10px; }
    .col li { padding: 9px 17px; border: 1px solid #e2e5eb; border-radius: 999px; background: #fff; color: #18202b; font-size: .95rem; box-shadow: 0 2px 6px rgba(0, 0, 0, .08); }
    .col li:first-child { border-top: 1px solid #e2e5eb; }

    /* ---------- Parcours ---------- */
    .path + .path { margin-top: 48px; }
    .path > h3 {
      font-family: var(--mono); font-size: .78rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px;
    }
    .row {
      display: grid; grid-template-columns: 150px 1fr; gap: 24px;
      padding: 18px 20px; margin-top: 12px; border: 1px solid var(--line);
      border-radius: 16px; background: var(--surface);
    }
    .row .when { font-family: var(--mono); font-size: .82rem; color: var(--muted); padding-top: 3px; }
    .row h4 { font-size: 1.02rem; }
    .row-heading { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .certificate { margin-left: auto; }
    .certificate[open] { flex: 1 0 100%; margin-left: 0; }
    .certificate summary {
      display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px;
      border: 1px solid rgba(0, 217, 163, .32); border-radius: 999px;
      color: var(--accent); cursor: pointer; font-size: .82rem; font-weight: 650;
      list-style: none;
    }
    .certificate summary::-webkit-details-marker { display: none; }
    .certificate summary::after { content: "+"; font-size: 1rem; line-height: 1; }
    .certificate[open] summary::after { content: "-"; }
    .certificate-preview { margin-top: 14px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); }
    .certificate-preview iframe { display: block; width: 100%; height: min(68vh, 620px); min-height: 360px; border: 0; border-radius: 8px; background: #fff; }
    .certificate-preview img { display: block; max-width: 100%; max-height: 68vh; margin: 0 auto; object-fit: contain; }
    .certificate-actions { display: flex; flex-wrap: wrap; gap: 16px; }
    .certificate-preview a { display: inline-block; margin-top: 10px; color: var(--accent); font-size: .88rem; text-underline-offset: 3px; }
    .row .where { color: var(--muted); font-size: .95rem; }
    .row ul { margin-top: 8px; }
    .row li { position: relative; padding-left: 16px; color: var(--muted); font-size: .95rem; }
    .row li::before { content: "–"; position: absolute; left: 0; }

    footer { border-top: 1px solid var(--line); padding: 56px 0 24px; color: var(--muted); font-size: .95rem; }
    .footer-grid { display: grid; grid-template-columns: 1.35fr .65fr 1fr; gap: 32px 48px; }
    .footer-brand { color: var(--text); font-size: 1.55rem; font-weight: 800; text-decoration: none; }
    .footer-brand span { color: var(--accent); }
    .footer-tagline { max-width: 430px; margin-top: 12px; }
    .footer-title { margin-bottom: 18px; color: var(--text); font-family: var(--mono); font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .footer-links { display: grid; gap: 12px; }
    .footer-links a, .footer-social a, .footer-contact a { color: var(--muted); text-decoration: none; transition: color .2s, border-color .2s, transform .2s; }
    .footer-links a:hover, .footer-social a:hover, .footer-contact a:hover { color: var(--text); }
    .footer-social { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
    .footer-social a { display: grid; width: 52px; height: 52px; place-items: center; border: 1px solid var(--line); border-radius: 50%; }
    .footer-social a:hover { border-color: var(--accent); transform: translateY(-2px); }
    .footer-social .ico { width: 20px; height: 20px; fill: currentColor; }
    .footer-social .ico.line { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .footer-contact { display: grid; gap: 14px; }
    .footer-contact li { display: flex; align-items: flex-start; gap: 12px; }
    .footer-contact .ico { flex: 0 0 18px; width: 18px; height: 18px; margin-top: 4px; fill: currentColor; }
    .footer-contact .ico.line { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .footer-contact a { overflow-wrap: anywhere; }
    .footer-bottom { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 24px; border-top: 1px solid var(--line); }
    .footer-bottom a { color: var(--muted); text-decoration: none; }
    .footer-bottom a:hover { color: var(--text); }

    .contact-cta { padding: 92px 24px; background: #fff; color: #0b0d12; text-align: center; }
    .contact-cta-inner { max-width: 1000px; margin: 0 auto; }
    .contact-cta-label { display: inline-flex; padding: 7px 18px; border: 1px solid #d8daf5; border-radius: 999px; background: #eff0ff; color: #4f5bff; font-family: var(--mono); font-size: .78rem; letter-spacing: .18em; text-transform: uppercase; }
    .contact-cta h2 { margin: 34px auto 40px; color: #0b0d12; font-size: clamp(2.6rem, 7vw, 5.7rem); line-height: 1.06; letter-spacing: -.055em; }
    .contact-cta h2 strong { display: block; background: linear-gradient(100deg, #4f5bff, #00cda0); background-clip: text; -webkit-background-clip: text; color: transparent; }
    .contact-cta-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 14px; }
    .contact-cta-link { display: inline-flex; align-items: center; justify-content: center; gap: 11px; min-height: 58px; padding: 14px 24px; border: 2px solid #dadddf; border-radius: 999px; color: #12151b; font-weight: 650; text-decoration: none; transition: transform .2s, background .2s; }
    .contact-cta-link:hover { transform: translateY(-2px); background: #f3f5f8; }
    .contact-cta-link.primary { border-color: #0b0d12; background: #0b0d12; color: #fff; }
    .contact-cta-link.primary:hover { background: #252934; }
    .contact-cta-link svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 20px; }

    /* ---------- Apparition douce ---------- */
    .js .reveal { opacity: 0; transform: translateY(16px); transition: opacity .6s, transform .6s; }
    .js .reveal.in { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .js .reveal { opacity: 1; transform: none; transition: none; }
      .portrait-floater { animation: none; }
    }

    /* ---------- Mobile ---------- */
    @media (max-width: 860px) {
      body { font-size: 16px; }
      .burger { display: inline-block; }
      .menu {
        position: absolute; top: 64px; left: 0; right: 0;
        flex-direction: column; gap: 0;
        padding: 8px; background: var(--surface); border: 1px solid var(--line);
        border-radius: 18px; box-shadow: 0 16px 40px rgba(0, 0, 0, .28);
        display: none;
      }
      .menu.open { display: flex; }
      .menu a { padding: 12px 16px; border: 0; }
      .menu a.active { color: var(--accent); background: rgba(0, 217, 163, .08); }

      .hero { min-height: 0; padding: 124px 0 48px; }
      .hero .wrap { grid-template-columns: 1fr; gap: 32px; }
      .portrait { max-width: 220px; order: -1; }
      .facts dl, .skills { grid-template-columns: 1fr; }
      .two { grid-template-columns: 1fr; gap: 32px; }
      .project { grid-template-columns: 1fr; gap: 20px; }
      .project:nth-of-type(even) .shot { order: 0; }
      .row { grid-template-columns: 1fr; gap: 4px; }
      .footer-grid { grid-template-columns: 1fr 1fr; }
      .footer-about { grid-column: 1 / -1; }
      .footer-bottom { grid-column: 1 / -1; }
    }
    @media (max-width: 540px) {
      .top { top: 8px; padding: 0 8px; }
      .top .wrap { min-height: 56px; padding: 0 14px; gap: 8px; }
      .brand { font-size: .98rem; }
      .tools { gap: 5px; }
      .lang button { padding: 5px 8px; }
      .pill { padding: 5px 8px; }
      .hero .wrap, .facts .wrap { padding: 0 18px; }
      .facts dl { grid-template-columns: 1fr; }
      .skills { grid-template-columns: 1fr; gap: 32px; }
      .project { padding: 14px; border-radius: 18px; }
      .contact-cta { padding: 72px 18px; }
      .contact-cta h2 { margin: 26px auto 30px; }
      .contact-cta-actions { flex-direction: column; align-items: stretch; }
      .contact-cta-link { overflow-wrap: anywhere; }
      .footer-grid { grid-template-columns: 1fr; gap: 28px; }
      .footer-about { grid-column: auto; }
      .footer-bottom { grid-column: auto; }
    }
  </style>
</head>
<body>

  <header class="top">
    <div class="wrap">
      <a href="#accueil" class="brand">Kader</a>

      <nav id="menu" class="menu">
        <a href="#profil" data-i18n="nav_profile"></a>
        <a href="#projets" data-i18n="nav_projects"></a>
        <a href="#services" data-i18n="nav_services"></a>
        <a href="#competences" data-i18n="nav_skills"></a>
        <a href="#parcours" data-i18n="nav_path"></a>
        <a href="#contact" data-i18n="nav_contact"></a>
      </nav>

      <div class="tools">
        <div class="lang" role="group" aria-label="Langue">
          <button type="button" id="btnFr" aria-pressed="true">FR</button>
          <button type="button" id="btnEn" aria-pressed="false">EN</button>
        </div>
        <a class="header-cv" href="CV_Kader_Youssouf_Elmi.pdf" download aria-label="Télécharger mon CV" title="Télécharger mon CV">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
          <span>CV</span>
        </a>
        <button type="button" id="burger" class="pill burger" aria-label="Menu">☰</button>
      </div>
    </div>
  </header>

  <main>

    <!-- ===== ACCUEIL ===== -->
    <section id="accueil" class="hero">
      <div class="wrap">
        <div>
          <p class="kicker" data-i18n="hero_hello"></p>
          <h1>Kader Youssouf Elmi</h1>
          <p class="role" data-i18n="hero_role"></p>
          <p class="lead" data-i18n="hero_lead"></p>

        fact1_t: "Degree", fact1_v: "Bachelor's 2026 · Master's in Software Engineering in progress",
        fact2_t: "Location", fact2_v: "Djibouti",
        fact3_t: "Languages", fact3_v: "French, English, Arabic, Somali",
        profile_title: "About",
        profile_p1: "I hold a Bachelor's degree in Computer Science from the University of Djibouti and I am looking for a computer scientist position in a dynamic company. I have solid foundations in programming, web development, databases, software engineering, networks and intelligent systems.",
        profile_p2: "Rigorous and autonomous, I enjoy teamwork and solving complex problems. I want to put my skills at the service of a team from my very first professional experience.",
        profile_p3: "Away from the screen: artificial intelligence, cybersecurity, hackathons, reading and learning the Quran.",
        langs_title: "Languages",
        projects_title: "Projects",
        services_title: "What I can build for you",
        services_intro: "As a Master's student in Software Engineering, I'm ready to deliver your project from start to finish.",
        services_open: "Up for any kind of adventure: internships, freelance work, hackathons and collaborative projects.",
        skills_title: "A toolkit for building practical solutions.",
        path_title: "Background",
        contact_title: "Contact",
        contact_cta_label: "Contact",
        contact_cta_title: "Let's discuss your",
        contact_cta_highlight: "next project.",
        verify_certificate: "Verify certificate",
        open_certificate: "Open certificate in a new tab",
        verify_online: "Verify on Coursera",
        l_email: "Email",
        see_more: "View project",
        back_top: "Back to top ↑",
      }
    };

    /* =====================================================
       3) AFFICHAGE (change selon la langue)
       ===================================================== */
    let lang = "fr";
    try { lang = localStorage.getItem("lang") || (navigator.language || "fr").slice(0, 2); } catch (e) {}
    if (!T[lang]) lang = "fr";

    // Prend la bonne langue si la valeur est un objet {fr, en}
    const pick = (v) => (v && typeof v === "object" && !Array.isArray(v) && (v.fr || v.en)) ? v[lang] : v;

    function renderStatic() {
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        el.textContent = T[lang][el.dataset.i18n];
      });
      document.getElementById("btnFr").setAttribute("aria-pressed", String(lang === "fr"));
      document.getElementById("btnEn").setAttribute("aria-pressed", String(lang === "en"));
    }

    function renderLanguages() {
      document.getElementById("langList").innerHTML = languages
        .map((l) => `<li><strong>${l[lang][0]}</strong> — ${l[lang][1]}</li>`).join("");
    }

    function renderProjects() {
      document.getElementById("projectList").innerHTML = projects.map((p) => `
        <article class="project">
          <figure class="shot" data-path="${p.image}">
            <img src="${p.image}" alt="${pick(p.title)}" loading="lazy"
                 onerror="this.parentElement.classList.add('missing')" />
          </figure>
          <div>
            <p class="meta">${pick(p.meta)}</p>
            <h3>${pick(p.title)}</h3>
            <p>${pick(p.desc)}</p>
            <div class="chips">${p.tags.map((t) => `<span>${pick(t)}</span>`).join("")}</div>
            ${p.link ? `<a class="more" href="${p.link}" target="_blank" rel="noopener">${T[lang].see_more} →</a>` : ""}
          </div>
        </article>`).join("");
    }

    function renderServices() {
      document.getElementById("serviceList").innerHTML = services.map((s) => `
        <div class="service"><h3>${pick(s.t)}</h3><p>${pick(s.d)}</p></div>`).join("");
    }

    function renderSkills() {
      document.getElementById("skillList").innerHTML = skills.map((s) => {
        const items = Array.isArray(s.i) ? s.i : s.i[lang];
        return `<div class="col"><h3>${pick(s.t)}</h3><ul>${items.map((x) => `<li>${x}</li>`).join("")}</ul></div>`;
      }).join("");
    }

    function renderPath() {
      document.getElementById("pathList").innerHTML = path.map((g) => `
        <div class="path">
          <h3>${pick(g.title)}</h3>
          ${g.rows.map((r) => {
            const certificateUrl = r.certificate
              ? r.certificate.split("/").map(encodeURIComponent).join("/")
              : "";
            const certificate = r.certificate
              ? `<details class="certificate">
                  <summary>${T[lang].verify_certificate}</summary>
                  <div class="certificate-preview">
                    ${r.certificate.toLowerCase().endsWith(".pdf")
                      ? `<iframe src="${certificateUrl}" title="${pick(r.h)}" loading="lazy"></iframe>`
                      : `<img src="${certificateUrl}" alt="${pick(r.h)}" loading="lazy" />`}
                    <div class="certificate-actions">
                      <a href="${certificateUrl}" target="_blank" rel="noopener">${T[lang].open_certificate}</a>
                      ${r.verificationUrl ? `<a href="${r.verificationUrl}" target="_blank" rel="noopener">${T[lang].verify_online}</a>` : ""}
                    </div>
                  </div>
                </details>`
              : "";
            return `
              <div class="row">
                <div class="when">${pick(r.when) || ""}</div>
                <div>
                  <div class="row-heading">
                    <h4>${pick(r.h)}</h4>
                    ${certificate}
                  </div>
                  <p class="where">${pick(r.w)}</p>
                  ${r.list ? `<ul>${r.list[lang].map((x) => `<li>${x}</li>`).join("")}</ul>` : ""}
                </div>
              </div>`;
          }).join("")}
        </div>`).join("");
    }

    // Logos (SVG) : contour pour email, téléphone, adresse ; plein pour LinkedIn et GitHub
    const ICONS = {
      mail: `<svg class="ico line" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>`,
      phone: `<svg class="ico line" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>`,
      pin: `<svg class="ico line" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>`,
      linkedin: `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>`,
      github: `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.62 1.59.23 2.76.11 3.05.74.81 1.18 1.83 1.18 3.09 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5z"/></svg>`
    };

    function renderFooter() {
      const t = T[lang];
      const phoneLink = PHONE.replace(/\s/g, "");
      const mapLink = "https://www.google.com/maps/search/?api=1&query=Djibouti";

      document.getElementById("footerSocial").innerHTML = `
        <a href="${GITHUB}" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">${ICONS.github}</a>
        <a href="${LINKEDIN}" target="_blank" rel="noopener" aria-label="LinkedIn" title="LinkedIn">${ICONS.linkedin}</a>
        <a href="mailto:${EMAIL}" aria-label="${t.l_email}" title="${t.l_email}">${ICONS.mail}</a>`;

      document.getElementById("footerContact").innerHTML = `
        <li>${ICONS.mail}<a href="mailto:${EMAIL}">${EMAIL}</a></li>
        <li>${ICONS.phone}<a href="tel:${phoneLink}">${PHONE}</a></li>
        <li>${ICONS.pin}<a href="${mapLink}" target="_blank" rel="noopener">${t.fact2_v}</a></li>`;
    }

    function renderAll() {
      renderStatic();
      renderLanguages();
      renderProjects();
      renderServices();
      renderSkills();
      renderPath();
      renderFooter();
    }

    function setLang(l) {
      lang = l;
      try { localStorage.setItem("lang", l); } catch (e) {}
      renderAll();
    }
    document.getElementById("btnFr").addEventListener("click", () => setLang("fr"));
    document.getElementById("btnEn").addEventListener("click", () => setLang("en"));

    /* =====================================================
       5) MENU MOBILE + LIEN ACTIF
       ===================================================== */
    const menu = document.getElementById("menu");
    document.getElementById("burger").addEventListener("click", () => menu.classList.toggle("open"));
    menu.querySelectorAll("a").forEach((a) => a.addEventListener("click", () => menu.classList.remove("open")));

    const sections = document.querySelectorAll("main section[id]");
    const links = menu.querySelectorAll("a");
    window.addEventListener("scroll", () => {
      let current = "";
      sections.forEach((s) => { if (window.scrollY >= s.offsetTop - 120) current = s.id; });
      links.forEach((l) => l.classList.toggle("active", l.getAttribute("href") === "#" + current));
    });

    /* =====================================================
       6) APPARITION DES SECTIONS
       ===================================================== */
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: 0.08 });
    document.querySelectorAll(".reveal").forEach((el) => io.observe(el));

    document.getElementById("year").textContent = new Date().getFullYear();

    renderAll();
  </script>
</body>
</html>
